name: Tests

# CPU-only checks. GPU-tagged nf-tests (`make test-nf-gpu`) and end2end_test.sh need GPUs and are run on the cluster.
on:
  pull_request:
    paths:
      - "main.nf"
      - "nextflow.config"
      - "nextflow_schema.json"
      - "nf-test.config"
      - "modules/**"
      - "lib/**"
      - "schemas/**"
      - "scripts/**"
      - "bindsweeper/**"
      - "tests/**"
      - "benchmarkdata/**"
      - "docker/Dockerfile.python_tools.dockerfile"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

# A new push to the same PR cancels the stale run.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  # Nextflow 24.10 fails to compile main.nf inside nf-test function tests; keep in line with the version used locally.
  NXF_VER: "25.10.0"
  NFT_VER: "0.9.5"
  # Where Nextflow stores images pulled from docker:// references.
  NXF_APPTAINER_CACHEDIR: ${{ github.workspace }}/.apptainer-cache
  NXF_ANSI_LOG: "false"

jobs:
  pytest-scripts:
    name: pytest (scripts)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      # openmm, pdbfixer and the mkdssp binary are not pip-installable (see scripts/requirements-test.txt).
      - name: Set up conda env
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: pdj-scripts-test
          create-args: >-
            python=3.12
            dssp=4.5
            openmm
            pdbfixer
          cache-environment: true
          cache-environment-key: scripts-${{ hashFiles('scripts/requirements-test.txt') }}

      # The CPU torch wheel is ~200 MB instead of ~2.5 GB for the default CUDA build.
      - name: Install Python test dependencies
        run: |
          grep -vE '^(torch|openmm|pdbfixer)$|^#|^$' scripts/requirements-test.txt > /tmp/requirements-pip.txt
          pip install -r /tmp/requirements-pip.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run pytest
        working-directory: scripts
        run: pytest --durations=10

  pytest-bindsweeper:
    name: pytest (bindsweeper)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: bindsweeper/uv.lock

      - name: Install dependencies
        working-directory: bindsweeper
        run: uv sync --frozen --extra test

      - name: Run pytest
        working-directory: bindsweeper
        run: uv run --frozen pytest --durations=10

  nf-test-unit:
    name: nf-test (unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NXF_VER }}

      - uses: nf-core/setup-nf-test@v1
        with:
          version: ${{ env.NFT_VER }}

      - name: Run nf-test unit tests
        run: make test-nf-unit

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-unit-logs
          path: |
            .nf-test.log
            .nextflow.log
          if-no-files-found: ignore

  nf-test-cpu:
    name: nf-test (cpu modules)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: ${{ env.NXF_VER }}

      - uses: nf-core/setup-nf-test@v1
        with:
          version: ${{ env.NFT_VER }}

      - uses: eWaterCycle/setup-apptainer@v3

      # Ubuntu 24.04 blocks the unprivileged user namespaces that Apptainer relies on.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # python_tools is the only image the CPU tests use; the key changes whenever its Dockerfile does.
      - name: Cache python_tools image
        uses: actions/cache@v4
        with:
          path: ${{ env.NXF_APPTAINER_CACHEDIR }}
          key: apptainer-python-tools-${{ hashFiles('docker/Dockerfile.python_tools.dockerfile') }}

      - name: Run nf-test CPU module tests
        env:
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: make test-nf-cpu PROFILE=ci

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nf-test-cpu-logs
          path: |
            .nf-test.log
            .nextflow.log
          if-no-files-found: ignore
