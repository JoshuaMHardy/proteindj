name: Build containers

on:
  push:
    branches: [containerrebuild] #change this to the branch you want to trigger the workflow on
    paths:
      - "docker/**"
      - ".github/workflows/build-containers.yml"
      - ".github/scripts/bake_matrix.py"
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated bake targets (e.g. fampnn-rocm,boltz2-cuda) or "all"'
        default: all

permissions:
  contents: read

jobs:
  # Lists the bake targets whose Dockerfile (or shared files) changed, so unrelated images aren't rebuilt.
  plan:
    name: Plan builds
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Bake reads SOURCE_URL from the environment, so forks label their images with their own repository.
      - name: Set image source label
        run: echo "SOURCE_URL=https://github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          TARGETS: ${{ inputs.targets }}
        run: python3 .github/scripts/bake_matrix.py

  build:
    name: build (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image source label
        run: echo "SOURCE_URL=https://github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"

      # GPU images are large; hosted runners start with little free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # Only the SIF is published; the image is an intermediate OCI archive. The registry cache
      # avoids the 10 GB GitHub Actions cache limit.
      - name: Build ${{ matrix.target }}
        uses: docker/bake-action@v5
        with:
          workdir: docker
          targets: ${{ matrix.target }}
          set: |
            *.output=type=oci,dest=${{ runner.temp }}/image.tar
            *.cache-from=type=registry,ref=${{ matrix.cache }}
            *.cache-to=type=registry,ref=${{ matrix.cache }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Free space before converting
        run: |
          docker buildx prune --all --force
          docker system prune --all --force --volumes
          df -h /

      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet apptainer
          # Ubuntu 24.04 blocks the unprivileged user namespaces that rootless Apptainer needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Convert ${{ matrix.image }} to SIF
        env:
          APPTAINER_TMPDIR: ${{ runner.temp }}
          APPTAINER_DISABLE_CACHE: "true"
        run: |
          apptainer build "${RUNNER_TEMP}/image.sif" "oci-archive:${RUNNER_TEMP}/image.tar"
          rm -f "${RUNNER_TEMP}/image.tar"
          ls -lh "${RUNNER_TEMP}/image.sif"
          df -h /

      # CPU-only import and --help checks; GPU runs are tested on the cluster.
      - name: Smoke test ${{ matrix.image }}
        run: apptainer exec "${RUNNER_TEMP}/image.sif" bash /opt/smoke/smoke_test.sh

      # The SIF takes the image's tag, so the pipeline pulls it with oras://.
      - name: Publish ${{ matrix.image }}
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          apptainer push --docker-username "${QUAY_USERNAME}" --docker-password "${QUAY_PASSWORD}" \
              "${RUNNER_TEMP}/image.sif" "oras://${{ matrix.image }}"
