name: Build containers

on:
  push:
    branches: [containerrebuild] #change this to the branch you want to trigger the workflow on
    paths:
      - "docker/**"
      - ".github/workflows/build-containers.yml"
      - ".github/scripts/bake_matrix.py"
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated bake targets (e.g. fampnn-rocm,boltz2-cuda) or "all"'
        default: all
      publish_sif:
        description: 'Also publish each image as an Apptainer SIF (tag suffix -sif)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Lists the bake targets whose Dockerfile (or shared files) changed, so unrelated images aren't rebuilt.
  plan:
    name: Plan builds
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      any: ${{ steps.matrix.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Bake reads SOURCE_URL from the environment, so forks label their images with their own repository.
      - name: Set image source label
        run: echo "SOURCE_URL=https://github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
      - id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          TARGETS: ${{ inputs.targets }}
        run: python3 .github/scripts/bake_matrix.py

  build:
    name: build (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image source label
        run: echo "SOURCE_URL=https://github.com/${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"

      # GPU images are large; hosted runners start with little free disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      # The registry cache avoids the 10 GB GitHub Actions cache limit.
      - name: Build and push ${{ matrix.target }}
        uses: docker/bake-action@v5
        with:
          workdir: docker
          targets: ${{ matrix.target }}
          push: true
          set: |
            *.cache-from=type=registry,ref=${{ matrix.cache }}
            *.cache-to=type=registry,ref=${{ matrix.cache }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Free space before testing
        run: |
          docker buildx prune --all --force
          docker system prune --all --force --volumes
          df -h /

      # CPU-only import and --help checks; GPU runs are tested on the cluster.
      - name: Smoke test ${{ matrix.image }}
        run: |
          docker pull "${{ matrix.image }}"
          docker run --rm "${{ matrix.image }}" bash /opt/smoke/smoke_test.sh

      - name: Free space before publishing the SIF
        if: inputs.publish_sif
        run: |
          docker system prune --all --force --volumes
          df -h /

      - name: Install Apptainer
        if: inputs.publish_sif
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update --quiet
          sudo apt-get install --yes --quiet apptainer

      # A SIF shares the repository and version with its image, with a -sif tag suffix, as Quay
      # repositories are flat. Cluster users can then download one file and skip the conversion.
      - name: Publish SIF for ${{ matrix.image }}
        if: inputs.publish_sif
        env:
          APPTAINER_DOCKER_USERNAME: ${{ secrets.QUAY_USERNAME }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
          APPTAINER_TMPDIR: ${{ runner.temp }}
          APPTAINER_CACHEDIR: ${{ runner.temp }}/apptainer-cache
        run: |
          apptainer pull "${RUNNER_TEMP}/image.sif" "docker://${{ matrix.image }}"
          apptainer push --docker-username "${APPTAINER_DOCKER_USERNAME}" --docker-password "${APPTAINER_DOCKER_PASSWORD}" \
              "${RUNNER_TEMP}/image.sif" "oras://${{ matrix.image }}-sif"
